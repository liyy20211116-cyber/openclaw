<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jarvis One Company OS</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #020617;
        color: #e2e8f0;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      .panel {
        width: min(640px, calc(100vw - 48px));
        padding: 32px;
        border-radius: 24px;
        background: rgba(15, 23, 42, 0.92);
        border: 1px solid rgba(148, 163, 184, 0.2);
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.35);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 28px;
      }
      p {
        margin: 0 0 10px;
        line-height: 1.6;
        color: #cbd5e1;
      }
      code {
        color: #7dd3fc;
      }
      .meta {
        margin-top: 20px;
        padding: 16px;
        border-radius: 16px;
        background: rgba(30, 41, 59, 0.72);
        border: 1px solid rgba(148, 163, 184, 0.14);
      }
      .label {
        color: #94a3b8;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <h1>桌面端暂时未连接成功</h1>
      <p id="summary">Electron 已启动，但当前目标资源尚未可用。</p>
      <p>开发态请确认已执行 <code>npm run desktop:start</code>，并等待 Vite 与写回 API 完全启动。</p>
      <p>生产态请先执行 <code>npm run desktop:build</code>，再运行 <code>npm run desktop:prod</code>。</p>
      <p>如果问题持续，可先运行 <code>npm run desktop:guide</code> 检查依赖与构建状态。</p>
      <div class="meta">
        <div class="label">当前模式</div>
        <p id="mode">-</p>
        <div class="label">目标资源</div>
        <p id="target">-</p>
        <div class="label">提示</div>
        <p id="hint">-</p>
      </div>
    </main>
    <script>
      const params = new URLSearchParams(window.location.search)
      const mode = params.get('mode') || 'development'
      const target = params.get('target') || 'unknown'
      const hint = params.get('hint') || '请检查桌面端资源是否已准备完成。'
      const summary =
        mode === 'production'
          ? 'Electron 已启动，但生产态静态资源尚未准备好。'
          : 'Electron 已启动，但开发态本地页面尚未连上。'

      document.getElementById('summary').textContent = summary
      document.getElementById('mode').textContent = mode
      document.getElementById('target').textContent = target
      document.getElementById('hint').textContent = hint
    </script>
  </body>
</html>
